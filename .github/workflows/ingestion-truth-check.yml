name: Ingestion truth check

# Asks whether what we believe about findr_conditions_snapshots is actually true.
#
# The companion to findr's check of the same name, pointed at a different table.
# findr watches grid_conditions_latest; this watches the 324 ICES rectangles
# that this repo's MET Norway and Open-Meteo jobs write, which nothing watched.
# Running the same assertions from both repos would be duplication, and
# duplication here has already cost real money -- both repos hammered the same
# NOAA endpoints until 2026-08-10, when both jobs began failing with 403/429.
#
# Scheduled after the day's ingestion rather than before it: MET runs every 6h
# from 00:00 and Open-Meteo at 02:30, so 09:00 reports on the night's real
# result rather than yesterday's leftovers.
#
# This is a MONITOR, not a gate. It blocks no one's work. A red run here means
# it found something, which is the job -- unlike a PR gate, where red-on-arrival
# just teaches people to ignore it.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ingestion-truth-check
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.repository == 'Dovieandi-se-tovya-sagain/godaisy-core' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run truth check
        id: truth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/ingestion-truth-check.ts

      # Matches how the ingestion workflows report: one open issue that
      # accumulates comments, rather than a new issue per run. A check that
      # spams is a check people mute.
      - name: Open or update the failure issue
        if: failure() && steps.truth.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Ingestion truth check failing';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingestion-truth-check',
            });

            const body = [
              'The ingestion truth check reported a **failing** assertion against',
              '`findr_conditions_snapshots`.',
              '',
              'A failure here is not "a run went wrong" — every check in that script',
              'compares a belief against evidence, so a failure means something we',
              'believe about the pipeline is not true.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'ingestion-truth-check', 'automated'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Still failing at ${new Date().toISOString()}\n\n${runUrl}`,
              });
            }

      # An alert that never clears is an alert nobody believes. Without this the
      # incident stays open after the pipeline recovers, and the next person to
      # look cannot tell a live problem from a stale one -- which is how the
      # tide waterfall sat visibly broken for a month. A monitor has to be able
      # to say "fixed", not only "broken".
      - name: Close the failure issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingestion-truth-check',
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — all assertions passed at ${new Date().toISOString()}\n\n${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
