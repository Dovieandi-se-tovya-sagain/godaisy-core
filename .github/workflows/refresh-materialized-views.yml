name: Refresh Materialized Views

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: refresh-materialized-views
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Dovieandi-se-tovya-sagain/godaisy-core' }}
    timeout-minutes: 5
    steps:
      - name: Refresh findr_conditions_latest
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/refresh_findr_conditions_latest" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          body=$(echo "$response" | head -n -1)
          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ findr_conditions_latest refreshed (HTTP $http_code)"
          else
            echo "⚠️  Refresh returned HTTP $http_code: $body"
            echo "Non-fatal: MV will be refreshed on next ingestion run."
          fi
