name: FINDR MET Norway ingestion (4x daily)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: findr-met-ingest
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Dovieandi-se-tovya-sagain/godaisy-core' }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run MET-only ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINDR_MET_ONLY: '1'
          FINDR_MET_SIMPLE_PROBES: '1'
          FINDR_CONDITIONS_DELAY_MS: '250'
        run: npx tsx scripts/ingestion/ingestFindrConditions.ts
