name: FINDR Copernicus ingestion (twice daily)

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '0 3,15 * * *'  # Twice daily: 03:00 and 15:00 UTC
  workflow_dispatch:
    inputs:
      region:
        description: 'Single region to test (leave empty for all 9)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Max cells to process (0 = all)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Force refresh (ignore freshness check)'
        required: false
        default: false
        type: boolean

concurrency:
  group: findr-copernicus-ingest
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  ingest:
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'Dovieandi-se-tovya-sagain/godaisy-core' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        region: ${{ github.event.inputs.region != '' && fromJson(format('["{0}"]', github.event.inputs.region)) || fromJson('["BAL","MED","BLK","IBI","NWS","ARC","GLO_AM","GLO_AP","GLO_AF"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "botocore>=1.40.46"
          pip install copernicusmarine xarray fsspec s3fs zarr numpy netCDF4 h5py dask pandas

      - name: Cache Copernicus Marine CLI state
        uses: actions/cache@v4
        with:
          path: |
            ~/.copernicusmarine
            ~/.config/copernicusmarine
            ~/.cache/copernicusmarine
          key: cmems-${{ runner.os }}-v1

      - name: Copernicus CLI login and version check
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: |
          echo "=== Copernicus Marine Toolbox version ==="
          copernicusmarine --version
          echo ""
          echo "=== Login ==="
          yes | copernicusmarine login --username "$COPERNICUS_USERNAME" --password "$COPERNICUS_PASSWORD"
          echo ""
          echo "=== Warm-up catalogue ==="
          copernicusmarine products --limit 1 || true

      - name: Run Copernicus data ingestion for ${{ matrix.region }} (with retry)
        id: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          FINDR_CONDITIONS_DELAY_MS: '200'
          FINDR_CONDITIONS_BATCH_SIZE: '10'
          FINDR_CONDITIONS_REGION: ${{ matrix.region }}
          FINDR_CONDITIONS_LIMIT: ${{ github.event.inputs.limit != '0' && github.event.inputs.limit || '' }}
          FINDR_CONDITIONS_FORCE_REFRESH: ${{ github.event.inputs.force == 'true' && 'true' || '' }}
        run: |
          echo "=== Ingesting region: ${{ matrix.region }} ==="
          npx tsx scripts/ingestion/ingest-copernicus-data.ts || {
            echo 'First attempt failed, retrying in 30s...'
            sleep 30
            npx tsx scripts/ingestion/ingest-copernicus-data.ts
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmems-ingest-logs-${{ matrix.region }}-${{ github.run_id }}
          path: |
            **/*.log
            copernicus-*.json
            run-*.txt
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'Dovieandi-se-tovya-sagain/godaisy-core' && always() }}
    needs: ingest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify data was ingested
        id: verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx scripts/ingestion/verify-database-status.ts

      - name: Create GitHub Issue on failure
        if: ${{ needs.ingest.result == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Copernicus Data Ingestion Failed';
            const body = `## Copernicus Data Ingestion Failure

            The scheduled Copernicus data ingestion workflow failed.

            **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Time**: ${new Date().toISOString()}

            ### Possible Causes:
            - Copernicus API credentials expired
            - Network issues
            - API rate limiting
            - Data validation failure

            ### Impact:
            - \`grid_conditions_latest\` table may have stale data for some regions
            - Predictions will show reduced accuracy or outdated data

            ### Actions Required:
            1. Check workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            2. Verify Copernicus credentials in GitHub Secrets
            3. Manually trigger workflow if needed
            4. Check Supabase table for data freshness`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'copernicus-ingestion-failure'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'copernicus-ingestion-failure', 'automated']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another failure occurred at ${new Date().toISOString()}\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            }

      - name: Close success issues
        if: ${{ needs.ingest.result == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'copernicus-ingestion-failure'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Copernicus ingestion is now working. Closing this issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
